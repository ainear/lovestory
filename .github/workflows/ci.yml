name: CI

on:
  pull_request:
    branches: [main]

# Only run on PRs to main — NOT on every push.
# This prevents double CI runs and email spam.
# Vercel already builds on every push — CI is only for PR quality gates.

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Type check shared
        run: pnpm --filter @lovestory/shared type-check
        continue-on-error: true

      - name: Type check db
        run: pnpm --filter @lovestory/db type-check
        continue-on-error: true

      - name: Lint web
        run: pnpm --filter @lovestory/web lint
        continue-on-error: true  # React-compiler ESLint errors in Next.js 15

      - name: Type check web
        run: pnpm --filter @lovestory/web type-check
